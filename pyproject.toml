[project]
name = "polymarket-model"
version = "0.1.0"
description = "Find +EV trades on Polymarket weather markets by comparing model probabilities to market odds."
requires-python = ">=3.12"
readme = { text = "Research-only Polymarket weather edge model. See plan in C:/Users/Sean/.claude/plans/.", content-type = "text/markdown" }
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=1.26,<2.3",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "structlog>=24.1",
    "pyarrow>=16.1",
    "duckdb>=1.0",
    "properscoring>=0.1",
    "openmeteo-requests>=1.3",
    "requests-cache>=1.2",
    "retry-requests>=2.0",
    "python-dateutil>=2.9",
    "tenacity>=8.5",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tabulate>=0.10.0",
]

[project.scripts]
polymarket = "polymarket_model.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_model"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
